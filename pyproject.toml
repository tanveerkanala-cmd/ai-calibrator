[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-calibrator"
version = "0.0.1"
description = "Turn your knowledge and standards into a tested, reliable AI — by interview, not by prompting."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "the AI Calibrator authors" }]
keywords = ["llm", "ai", "evaluation", "prompt-engineering", "fine-tuning", "calibration"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "pydantic>=2.6",
    "typer>=0.16",
    "httpx>=0.27",
    "pyyaml>=6.0",
    # `regex` (not stdlib `re`) so deterministic regex checks can enforce a match
    # timeout — stdlib re can't be interrupted mid-backtrack, so a catastrophic
    # owner-authored pattern would hang the eval. See checks.py.
    "regex>=2024.5.10",
]

[project.urls]
Repository = "https://github.com/tanveerkanala-cmd/ai-calibrator"
Issues = "https://github.com/tanveerkanala-cmd/ai-calibrator/issues"

[project.optional-dependencies]
# anthropic>=0.77: the adapter passes `output_config=` to messages.create,
# which older releases reject with a TypeError before any network call.
cloud = ["anthropic>=0.77", "openai>=1.40"]
api = ["fastapi>=0.110", "uvicorn>=0.29", "python-multipart>=0.0.9"]
rag = ["lancedb>=0.6", "sentence-transformers>=2.6"]
docs = ["pypdf>=4.0", "python-docx>=1.1"]
# The Advanced tier's fine-tuning stack. `calibrate train` runs the generated
# bundle; these are what its train.py imports. (bitsandbytes for QLoRA is CUDA-
# only, so it's installed on demand by `train --qlora`, not pinned here.)
# trl>=1.0: the generated train.py passes SFTConfig(max_length=...), which trl
# renamed from max_seq_length in 1.x — 0.12 raises on it.
# transformers>=4.56.2: train.py and merge.py load the base with `dtype=`, which
# from_pretrained only accepts from 4.56 (before that it reaches the model
# constructor as a TypeError) — and 4.56.2 is trl 1.x's own floor.
train = ["torch>=2.2", "transformers>=4.56.2", "trl>=1.0", "peft>=0.11", "datasets>=2.19", "accelerate>=0.30"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "fastapi>=0.110", "python-multipart>=0.0.9", "ruff>=0.6", "mypy>=1.11", "bandit>=1.7", "hypothesis>=6.100"]
# Everything a user might want (all engines + web UI + document ingestion).
# Excludes `train` (heavy GPU stack — install explicitly) and `dev`.
all = ["ai-calibrator[cloud,api,rag,docs]"]

[project.scripts]
calibrate = "ai_calibrator.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_calibrator"]

[tool.hatch.build.targets.sdist]
# BUILD-PLAN.md is the internal roadmap this was built against: useful in the
# repo, but in a release artifact it is stale the day it ships and reads as
# documentation of the tool.
exclude = ["docs/BUILD-PLAN.md"]

[tool.pytest.ini_options]
# -ra reports skip reasons in the summary, so an optional-extra module that
# skips its whole file (e.g. rag without lancedb) is visible instead of hiding
# inside a bare "N skipped" line.
addopts = "-ra"

[tool.mypy]
python_version = "3.10"
files = ["src/ai_calibrator"]
# Optional extras (cloud engines, RAG, document parsing, the web server) are not
# installed in every environment and several ship no type information. Their
# absence is a packaging fact, not a defect in this code — the modules that use
# them already import lazily and degrade with a friendly message.
[[tool.mypy.overrides]]
module = [
    "anthropic.*", "openai.*", "lancedb.*", "sentence_transformers.*",
    "pypdf.*", "docx.*", "torch.*", "uvicorn.*", "regex.*", "yaml.*",
]
ignore_missing_imports = true

[tool.ruff.lint]
# Bug-focused static-analysis gate: pyflakes (F), bugbear (B), syntax (E9).
# B008 and B904 are intentional framework idioms here — Typer/FastAPI require
# call-based argument defaults (Option/Argument/Depends), and caught errors are
# deliberately converted into friendly typer.Exit / HTTPException without
# exception chaining. Run:  ruff check .
select = ["E9", "F", "B"]
ignore = ["B008", "B904"]

[tool.bandit]
# Security lint:  bandit -r src/ai_calibrator
exclude_dirs = ["tests"]
