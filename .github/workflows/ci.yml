name: ci

on:
  push:
    branches: [main]
  pull_request:

# Read-only token: no job writes to the repo, so none should be able to.
permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, python: "3.10" }   # the declared floor
          - { os: ubuntu-latest, python: "3.12" }
          - { os: ubuntu-latest, python: "3.14" }
          - { os: macos-latest, python: "3.12" }
          - { os: windows-latest, python: "3.12" }  # exercises the msvcrt lock path
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install (dev extra — no cloud SDKs needed; tests use fake engines)
        run: pip install -e '.[dev]'
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest -q

  full-extras:
    # The `dev` extra excludes rag/openai/docx, and tests for those modules
    # importorskip when their libraries are absent — so on `dev` alone the entire
    # RAG layer (and a few openai/docx tests) NEVER RUN. This job installs every
    # extra so retrieval, the OpenAI adapter, and document parsing are exercised
    # on each push, and fails if anything skips — a skip here means an extra
    # silently failed to import and a whole layer went untested behind a green badge.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install (all engines + web UI + docs + dev)
        run: pip install -e '.[all,dev]'
      - name: Every optional extra must actually import
        # The real guard. A loose collected-count floor could not catch this: losing
        # the whole retrieval layer costs only ~10 collected tests, and losing
        # openai/docx costs zero, so the count stayed above any sane threshold in
        # exactly the scenarios this job exists to prevent.
        run: python -c "import lancedb, sentence_transformers, openai, docx, pypdf, anthropic"
      - name: Test — and fail on any skip (one run, not two)
        # With [all,dev] installed nothing here has a legitimate reason to skip, so
        # `-W error` is not needed: the skip count IS the coverage guard. Tee the
        # output so the assertion reads the same run the log shows.
        run: |
          set -o pipefail
          pytest -q -rs | tee pytest.out
          SKIPPED=$(grep -c "^SKIPPED" pytest.out || true)
          echo "skipped: $SKIPPED"
          test "$SKIPPED" -eq 0

  locale:
    # Guards the encoding class: files are written UTF-8, so every read must be
    # too. Running the whole suite under a non-UTF-8 locale catches any regression
    # that would crash on Windows (cp1252) or a POSIX box with LC_ALL=C.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -e '.[dev]'
      - name: Test under a non-UTF-8 locale (LC_ALL=C)
        run: LC_ALL=C LANG=C PYTHONUTF8=0 pytest -q

  security:
    # Static security scan. Fails only on MEDIUM+ severity, so the known, justified
    # Low findings (the fixed `ant` subprocess, best-effort except-pass) don't gate.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -e '.[dev]'
      - name: Bandit (medium+ severity)
        run: bandit -r src/ai_calibrator --severity-level medium -q
