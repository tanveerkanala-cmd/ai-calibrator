name: ci

on:
  push:
    branches: [main]
  pull_request:

# Read-only token: no job writes to the repo, so none should be able to.
permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, python: "3.10" }   # the declared floor
          - { os: ubuntu-latest, python: "3.12" }
          - { os: ubuntu-latest, python: "3.14" }
          - { os: macos-latest, python: "3.12" }
          - { os: windows-latest, python: "3.12" }  # exercises the msvcrt lock path
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install (dev extra — no cloud SDKs needed; tests use fake engines)
        run: pip install -e '.[dev]'
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest -q

  full-extras:
    # The `dev` extra excludes rag/openai/docx, and tests for those modules
    # importorskip when their libraries are absent — so on `dev` alone the entire
    # RAG layer (and a few openai/docx tests) NEVER RUN. This job installs every
    # extra so retrieval, the OpenAI adapter, and document parsing are exercised
    # on each push, and fails if anything skips — a skip here means an extra
    # silently failed to import and a whole layer went untested behind a green badge.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install (all engines + web UI + docs + dev)
        run: pip install -e '.[all,dev]'
      - name: Every optional extra must actually import
        # The real guard. A loose collected-count floor could not catch this: losing
        # the whole retrieval layer costs only ~10 collected tests, and losing
        # openai/docx costs zero, so the count stayed above any sane threshold in
        # exactly the scenarios this job exists to prevent.
        run: python -c "import lancedb, sentence_transformers, openai, docx, pypdf, anthropic"
      - name: Test — and fail on any skip (one run, not two)
        # With [all,dev] installed nothing here has a legitimate reason to skip, so
        # `-W error` is not needed: the skip count IS the coverage guard. Tee the
        # output so the assertion reads the same run the log shows.
        run: |
          set -o pipefail
          pytest -q -rs | tee pytest.out
          SKIPPED=$(grep -c "^SKIPPED" pytest.out || true)
          echo "skipped: $SKIPPED"
          test "$SKIPPED" -eq 0

  locale:
    # Guards the encoding class: files are written UTF-8, so every read must be
    # too. Running the whole suite under a non-UTF-8 locale catches any regression
    # that would crash on Windows (cp1252) or a POSIX box with LC_ALL=C.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -e '.[dev]'
      - name: Test under a non-UTF-8 locale (LC_ALL=C)
        run: LC_ALL=C LANG=C PYTHONUTF8=0 pytest -q

  security:
    # Static security scan. Fails only on MEDIUM+ severity, so the known, justified
    # Low findings (the fixed `ant` subprocess, best-effort except-pass) don't gate.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -e '.[dev]'
      - name: Bandit (medium+ severity)
        run: bandit -r src/ai_calibrator --severity-level medium -q

  package:
    # Every other job installs with `pip install -e`, which imports straight from
    # src/ and therefore proves nothing about the DISTRIBUTION. This builds the
    # wheel and sdist, installs each into a clean venv, and exercises the console
    # script from site-packages — so a packaging mistake (a missing web asset, a
    # dropped py.typed, a broken entry point) fails here instead of reaching the
    # first stranger who runs `pip install`.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build wheel + sdist
        run: |
          pip install build twine
          python -m build
          twine check dist/*
      - name: Wheel ships what it must, and nothing it must not
        run: |
          python - <<'PY'
          import zipfile, glob, sys
          whl = glob.glob("dist/*.whl")[0]
          names = zipfile.ZipFile(whl).namelist()
          required = ["ai_calibrator/py.typed", "ai_calibrator/web/index.html",
                      "ai_calibrator/web/app.js", "ai_calibrator/web/style.css"]
          missing = [r for r in required if r not in names]
          leaked = [n for n in names if n.startswith(("tests/", "docs/")) or n.endswith(".lock")]
          print(f"{whl}: {len(names)} files")
          if missing or leaked:
              print("MISSING:", missing)
              print("LEAKED:", leaked)
              sys.exit(1)
          PY
      - name: Install the WHEEL into a clean venv and run the console script
        run: |
          python -m venv /tmp/wheelenv
          /tmp/wheelenv/bin/pip install -q "$(ls dist/*.whl)[api]"
          /tmp/wheelenv/bin/calibrate --version
          /tmp/wheelenv/bin/calibrate --help > /dev/null
          # The UI must be served from site-packages, not from the source tree.
          /tmp/wheelenv/bin/python - <<'PY'
          from pathlib import Path
          import ai_calibrator, ai_calibrator.api as api
          assert "site-packages" in ai_calibrator.__file__, ai_calibrator.__file__
          for asset in ("index.html", "app.js", "style.css"):
              p = Path(api.WEB_DIR) / asset
              assert p.is_file(), f"{asset} missing from the installed package"
          print("installed package serves its own web assets")
          PY
      - name: Sdist ships the docs a user needs, not the one we built against
        run: |
          python - <<'PY'
          import glob, sys, tarfile
          sdist = glob.glob("dist/*.tar.gz")[0]
          names = [n.split("/", 1)[-1] for n in tarfile.open(sdist).getnames()]
          # The internal roadmap is stale the day it ships, and to someone who
          # unpacks the release it reads as documentation of the tool.
          leaked = [n for n in names if n == "docs/BUILD-PLAN.md"]
          missing = [n for n in ("README.md", "LICENSE", "docs/USAGE.md") if n not in names]
          if leaked or missing:
              print("LEAKED:", leaked)
              print("MISSING:", missing)
              sys.exit(1)
          print(f"{sdist}: {len(names)} files, roadmap excluded")
          PY
      - name: Install the SDIST into a clean venv
        run: |
          python -m venv /tmp/sdistenv
          /tmp/sdistenv/bin/pip install -q "$(ls dist/*.tar.gz)"
          /tmp/sdistenv/bin/calibrate --version
